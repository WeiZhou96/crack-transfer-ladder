policy: >-
  Any image inspected during pre-freeze model or pipeline QA makes its entire group ineligible for
  train/val/test. s03 assigns the group to development_exposed so it cannot enter formal evaluation.
  Data-hygiene duplicate adjudication is carved out only when reviewers inspect source images,
  never inspect model outputs, and decide only whether a pair is duplicate; that review does not
  count as development exposure. Any model-output inspection remains an exposure.

